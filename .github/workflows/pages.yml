name: pages

# Publish the static site to GitHub Pages on every push to main, and every
# 3 hours to refresh the release-data snapshot the page falls back to when
# the visitor's GitHub API quota (60 requests/hour per IP) is used up.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # refresh the release snapshot every 3 hours
  workflow_dispatch:

permissions:
  contents: write # push clone counts to the data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check links, scripts and the Markdown renderer
        run: |
          node --check assets/js/site.js
          node --check assets/js/keys.js
          node --check assets/js/markdown.js
          node --test scripts/test-markdown.mjs
          python3 scripts/check-links.py
      - name: Snapshot WraithVim release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/data
          gh api repos/cachewraith/wraithvim > assets/data/repo.json
          gh api "repos/cachewraith/wraithvim/releases?per_page=100" > assets/data/releases.json
          python3 -c "import json; d=json.load(open('assets/data/releases.json')); print(len(d), 'releases snapshotted')"
      # Clone traffic needs a token that can read cachewraith/wraithvim's
      # settings (fine-grained, Administration: read-only) in the TRAFFIC_TOKEN
      # secret. GitHub keeps 14 days of it, so the history lives on the data
      # branch; without the secret the saved counts are published unchanged.
      - name: Update clone counts
        continue-on-error: true
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/data"
          if git fetch --quiet origin data; then
            git worktree add --quiet -B data "$dir" FETCH_HEAD
          else
            git worktree add --quiet --orphan -b data "$dir"
          fi
          python3 scripts/clones.py "$dir/clones.json"
          [ -f "$dir/clones.json" ] || exit 0
          cp "$dir/clones.json" assets/data/clones.json
          cd "$dir"
          git add clones.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "data: clone counts"
          git push --quiet origin data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
